[global]
pid = /srv/logs/php-fpm.pid
error_log = /srv/logs/web.log

[www]
listen = /srv/logs/php-fpm.sock
pm = dynamic
pm.max_children = 4
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4

; extra hardening for CVE-2026-109619 (PHP itself is patched, see dockers/php-patches/)
; php_admin_value cannot be overridden by ini_set() or .user.ini
; see https://www.php.net/archive/2026.php#2026-10-21-5
php_admin_value[session.upload_progress.enabled] = 0

include=/srv/logs/env.conf
